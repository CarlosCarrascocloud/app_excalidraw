<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qallpa Draw - Colaborativo</title>
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <div id="name-modal">
        <div class="modal-box">
            <h2>Bienvenido a Qallpa Draw</h2>
            <p>Ingresa tu nombre para que otros te identifiquen</p>
            <input type="text" id="name-input" placeholder="Tu nombre..." maxlength="20" autofocus>
            <div class="modal-buttons">
                <button id="name-cancel">Entrar sin nombre</button>
                <button id="name-confirm" class="primary">Entrar</button>
            </div>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div>Cargando Excalidraw...</div>
    </div>

    <div id="app-container">
        <div id="toolbar">
            <div class="left">
                <strong>Qallpa Scalidraw</strong>
                <div id="status-indicator"></div>
                <span id="status-text">Desconectado</span>
            </div>
            <div>
                <span id="users-count"></span>
                <span id="room-name"></span>
            </div>
        </div>
        <div id="excalidraw-container"></div>
    </div>

    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@excalidraw/excalidraw@0.17.3/dist/excalidraw.production.min.js"></script>
    <script src="js/collaboration.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
